
services:
   db:
      image: jhnnsrs/daten:next
      # Throwaway test DB: trade durability for speed (flush/TRUNCATE per test)
      command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - 5555:5432
   rustfs:
      environment:
         RUSTFS_VOLUMES: /data
         RUSTFS_ADDRESS: ":9000"
         RUSTFS_SECRET_KEY: e8821a29d189789e39c9922a3bfcfb4a
         RUSTFS_ACCESS_KEY: crappygreysetter
      image: rustfs/rustfs:latest
      ports:
         - 6890:9000
   initc:
      depends_on:
         rustfs:
            condition: service_started
      environment:
         RUSTFS_HOST: http://rustfs:9000
         RUSTFS_SECRET_KEY: e8821a29d189789e39c9922a3bfcfb4a
         RUSTFS_ACCESS_KEY: crappygreysetter
      image: jhnnsrs/init:next
      volumes:
         - ./configs/rustfs.yaml:/workspace/config.yaml
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - 6666:6379

volumes:
   chroma_data:
